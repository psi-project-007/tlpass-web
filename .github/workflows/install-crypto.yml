name: Install crypto package

on:
  workflow_dispatch:
  pull_request:
    paths: ['.npmrc', '.github/workflows/install-crypto.yml']

permissions:
  contents: read
  packages: read

jobs:
  install:
    name: install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 22 for GitHub Packages
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@psi-project-007'

      - name: Install tlpass-crypto 0.1.0
        run: npm install @psi-project-007/tlpass-crypto@0.1.0 --save-exact
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package imports in Node
        run: node -e "import('@psi-project-007/tlpass-crypto').then(m => console.log(Object.keys(m).length + ' exports'))"